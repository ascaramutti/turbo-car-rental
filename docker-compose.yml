services:

  mysql:
    image: mysql:8.0
    container_name: turbo-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: turbo_db
      MYSQL_USER: turbo_user
      MYSQL_PASSWORD: turbo_pass
    volumes:
      - turbo-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: turbo-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  turbo-mysql-data:
