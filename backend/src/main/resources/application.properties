# Application
spring.application.name=turbo-car-rental
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/turbo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=turbo_user
spring.datasource.password=turbo_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=TurboCarRentalSecretKeyForJWTTokenGeneration2024VancouverBC
jwt.expiration=1800000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# Mail (MailHog for development)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:80,http://localhost
