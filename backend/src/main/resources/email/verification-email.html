<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 30px; background: #f9f9f9; border-radius: 12px;">
    <h1 style="color: #F58220; text-align: center; margin-bottom: 10px;">TURBO</h1>
    <h2 style="text-align: center; color: #1F2937;">Email Verification</h2>
    <p style="color: #4B5563;">Hi {{firstName}},</p>
    <p style="color: #4B5563;">Your verification code is:</p>
    <div style="text-align: center; margin: 25px 0;">
        <span style="font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #1F2937; background: #fff; padding: 15px 30px; border-radius: 8px; border: 2px solid #F58220;">{{otp}}</span>
    </div>
    <p style="color: #6B7280; font-size: 14px; text-align: center;">This code expires in <strong>{{expiryMinutes}} minutes</strong>.</p>
    <p style="color: #6B7280; font-size: 13px; text-align: center; margin-top: 20px;">If you didn't create an account, ignore this email.</p>
</div>
