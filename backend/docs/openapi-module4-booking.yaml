  # ── Owner: Cancel Booking ───────────────────────────────────────

  /api/owner/bookings/{bookingId}/cancel:
    put:
      tags: [OwnerBooking]
      summary: Cancel a confirmed booking (owner)
      description: |
        Cancels a CONFIRMED booking. Owner can only cancel bookings in CONFIRMED status
        (not PENDING or IN_PROGRESS). A cancellation reason is required.
        Sets `cancelledBy = "OWNER"`. An email notification is sent to the driver.
        Requires JWT authentication with CAR_OWNER role.
      operationId: cancelBookingByOwner
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Booking ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
