components:
  schemas:
    # ── Request DTOs ──────────────────────────────────────────────

    CreateBookingRequest:
      type: object
      required: [vehicleId, startTime, endTime]
      properties:
        vehicleId:
          type: integer
          format: int64
          minimum: 1
          description: "ID of the vehicle to book. Must reference an existing APPROVED and active vehicle."
          example: 5
        startTime:
          type: string
          format: date-time
          description: "Shift start datetime. Must be in the future. Must be within vehicle's `availableUntil` window."
          example: "2026-03-20T08:00:00"
        endTime:
          type: string
          format: date-time
          description: "Shift end datetime. Must be >= startTime + 4 hours and <= startTime + 24 hours. Must not exceed vehicle's `availableUntil`."
          example: "2026-03-20T16:00:00"

    CancelBookingRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "^[a-zA-Z0-9\\u00C0-\\u00FF\\s.,!?()\\'\\+:\\-/]*$"
          description: "Cancellation reason. Letters, numbers, spaces, and basic punctuation only. Max 500 characters."
          example: "Schedule conflict, cannot make it"

    RejectBookingRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: "^[a-zA-Z0-9\\u00C0-\\u00FF\\s.,!?()\\'\\+:\\-/]*$"
          description: "Rejection reason. Letters, numbers, spaces, and basic punctuation only. Max 500 characters."
          example: "Vehicle is unavailable for those dates"

    # ── Response DTOs ─────────────────────────────────────────────

    BookingResponse:
      type: object
      description: "Summary booking information returned for list views and action confirmations."
      properties:
        bookingId:
          type: integer
          format: int64
          example: 1
        driverId:
          type: integer
          format: int64
          description: "Driver user ID"
          example: 2
        driverFullName:
          type: string
          description: "Driver's firstName + lastName"
          example: "John Doe"
        vehicleId:
          type: integer
          format: int64
          description: "Vehicle ID"
          example: 5
        vehicleSummary:
          type: string
          description: "Formatted as 'year make model' (e.g. '2022 Toyota Corolla')"
          example: "2022 Toyota Corolla"
        status:
          type: string
          enum: [PENDING, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED, REJECTED]
          description: "Current booking status"
          example: "PENDING"
        startTime:
          type: string
          format: date-time
          description: "Shift start datetime (ISO-8601)"
          example: "2026-03-20T08:00:00"
        endTime:
          type: string
          format: date-time
          description: "Shift end datetime (ISO-8601)"
          example: "2026-03-20T16:00:00"
        totalHours:
          type: integer
          minimum: 4
          maximum: 24
          description: "Total booked hours"
          example: 8
        totalPrice:
          type: number
          format: double
          description: "Computed total cost (totalHours * hourlyRate at booking creation)"
          example: 124.00
        createdAt:
          type: string
          format: date-time
          description: "Booking creation timestamp (ISO-8601)"
          example: "2026-03-17T10:00:00.000"
        updatedAt:
          type: string
          format: date-time
          description: "Last modification timestamp (ISO-8601)"
          example: "2026-03-17T10:00:00.000"

    BookingDetailResponse:
      type: object
      description: "Full booking details including vehicle info, owner info, photos, and timestamps. Extends BookingResponse."
      allOf:
        - $ref: '#/components/schemas/BookingResponse'
        - type: object
          properties:
            ownerId:
              type: integer
              format: int64
              description: "Vehicle owner user ID"
              example: 3
            ownerFullName:
              type: string
              description: "Owner's firstName + lastName"
              example: "Jane Smith"
            vehicleMake:
              type: string
              description: "Vehicle make"
              example: "Toyota"
            vehicleModel:
              type: string
              description: "Vehicle model"
              example: "Corolla"
            vehicleYear:
              type: integer
              description: "Vehicle year"
              example: 2022
            vehicleLicensePlate:
              type: string
              description: "Vehicle license plate"
              example: "ABC 1234"
            vehicleCategory:
              type: string
              enum: [SEDAN, SUV, VAN, TRUCK, COMPACT]
              description: "Vehicle category"
              example: "SEDAN"
            vehicleServiceType:
              type: string
              enum: [TAXI_AND_DELIVERY, DELIVERY_ONLY]
              description: "Vehicle's service type classification"
              example: "TAXI_AND_DELIVERY"
            vehicleHourlyRate:
              type: number
              format: double
              description: "Vehicle's hourly rate at the time of booking"
              example: 15.50
            pickupLocation:
              type: string
              nullable: true
              maxLength: 200
              description: "Human-readable pickup location. Set when booking is confirmed."
              example: "Downtown Vancouver"
            pickupPhotoUrls:
              type: array
              items:
                type: string
              nullable: true
              description: "URLs to pickup condition photos. Empty list until shift starts."
              example: ["/files/bookings/1/pickup/photo1.jpg", "/files/bookings/1/pickup/photo2.jpg"]
            returnPhotoUrls:
              type: array
              items:
                type: string
              nullable: true
              description: "URLs to return condition photos. Empty list until shift completes."
              example: []
            cancellationReason:
              type: string
              nullable: true
              maxLength: 500
              description: "Reason for cancellation or rejection. Null if not cancelled/rejected."
              example: null
            cancelledBy:
              type: string
              nullable: true
              enum: [DRIVER, OWNER, SYSTEM]
              description: "Who initiated the cancellation. Null if not cancelled."
              example: null
            confirmedAt:
              type: string
              format: date-time
              nullable: true
              description: "Timestamp when owner confirmed (ISO-8601). Null if not confirmed."
              example: "2026-03-17T12:00:00.000"
            startedAt:
              type: string
              format: date-time
              nullable: true
              description: "Timestamp when driver started shift (ISO-8601). Null if not started."
              example: null
            completedAt:
              type: string
              format: date-time
              nullable: true
              description: "Timestamp when shift completed (ISO-8601). Null if not completed."
              example: null
            cancelledAt:
              type: string
              format: date-time
              nullable: true
              description: "Timestamp when booking was cancelled (ISO-8601). Null if not cancelled."
              example: null
            effectiveServiceType:
              type: string
              enum: [TAXI_AND_DELIVERY, DELIVERY_ONLY]
              description: "Effective service type based on driver's license class + vehicle classification. See service type matching rules."
              example: "TAXI_AND_DELIVERY"
            serviceTypeWarning:
              type: string
              nullable: true
              description: "Informational warning about service type restrictions. Null when no mismatch. NOT a hard block."
              example: null

    # NOTE: Pickup location coordinates (pickupLatitude, pickupLongitude) are NOT included in
    # BookingDetailResponse. Use the dedicated GET /vehicle-location endpoint which handles
    # the time-based masking logic (masked > 2h before start, exact <= 2h before start).

    VehicleSearchResponse:
      type: object
      description: "Vehicle information in search results. Coordinates are masked (~1km radius)."
      properties:
        vehicleId:
          type: integer
          format: int64
          example: 5
        make:
          type: string
          description: "Vehicle manufacturer"
          example: "Toyota"
        model:
          type: string
          description: "Vehicle model"
          example: "Corolla"
        year:
          type: integer
          description: "Vehicle year"
          example: 2022
        category:
          type: string
          enum: [SEDAN, SUV, VAN, TRUCK, COMPACT]
          description: "Vehicle category"
          example: "SEDAN"
        fuelType:
          type: string
          enum: [GASOLINE, DIESEL, ELECTRIC, HYBRID]
          description: "Fuel type"
          example: "GASOLINE"
        serviceType:
          type: string
          enum: [TAXI_AND_DELIVERY, DELIVERY_ONLY]
          description: "Vehicle's assigned service type classification"
          example: "TAXI_AND_DELIVERY"
        hourlyRate:
          type: number
          format: double
          minimum: 1.00
          description: "Hourly rental rate in dollars"
          example: 15.50
        description:
          type: string
          nullable: true
          maxLength: 500
          description: "Vehicle description"
          example: "Well-maintained sedan, ideal for ride-sharing"
        generalLocation:
          type: string
          maxLength: 100
          description: "Masked general location name"
          example: "Downtown Vancouver"
        maskedLatitude:
          type: number
          format: double
          description: "Latitude rounded to ~1km radius: Math.round(lat * 100) / 100.0"
          example: 49.28
        maskedLongitude:
          type: number
          format: double
          description: "Longitude rounded to ~1km radius: Math.round(lng * 100) / 100.0"
          example: -123.12
        availableUntil:
          type: string
          format: date-time
          description: "Datetime until which the vehicle is available (ISO-8601)"
          example: "2026-03-25T18:00:00"
        ownerFullName:
          type: string
          description: "Vehicle owner's display name"
          example: "Jane Smith"
        ownerRating:
          type: number
          format: float
          nullable: true
          description: "Owner's average rating (0.0 - 5.0)"
          example: 4.5
        effectiveServiceType:
          type: string
          enum: [TAXI_AND_DELIVERY, DELIVERY_ONLY]
          description: "Effective service type based on the driver's license class combined with the vehicle's classification. A CLASS_5 driver booking a TAXI_AND_DELIVERY vehicle will see DELIVERY_ONLY here."
          example: "TAXI_AND_DELIVERY"
        serviceTypeWarning:
          type: string
          nullable: true
          description: "Informational warning if the driver's license restricts usage. Null when there is no restriction or mismatch. This is NOT a hard block — booking is still allowed."
          example: null

    VehicleBookingDetailResponse:
      type: object
      description: "Full vehicle details for booking consideration. Extends VehicleSearchResponse with licensePlate, ownerId, and vin."
      allOf:
        - $ref: '#/components/schemas/VehicleSearchResponse'
        - type: object
          properties:
            licensePlate:
              type: string
              description: "Vehicle license plate"
              example: "ABC 1234"
            ownerId:
              type: integer
              format: int64
              description: "Vehicle owner user ID"
              example: 3
            vin:
              type: string
              description: "Vehicle Identification Number"
              example: "1HGBH41JXMN109186"

    VehicleLocationResponse:
      type: object
      description: "Vehicle pickup location. Masked by default, exact coordinates revealed 2 hours before a confirmed booking's start time."
      properties:
        vehicleId:
          type: integer
          format: int64
          example: 5
        isExactLocation:
          type: boolean
          description: "True when exact coordinates are revealed (within 2h of confirmed booking start, or COMPLETED status)"
          example: false
        generalLocation:
          type: string
          maxLength: 100
          description: "Human-readable area name"
          example: "Downtown Vancouver"
        latitude:
          type: number
          format: double
          description: "Masked or exact latitude depending on timing and booking status"
          example: 49.28
        longitude:
          type: number
          format: double
          description: "Masked or exact longitude depending on timing and booking status"
          example: -123.12
        message:
          type: string
          description: "Human-readable message about location availability"
          example: "Exact location will be available 2 hours before your booking"

    AdminBookingResponse:
      type: object
      description: "Booking information for admin list view. Extends BookingResponse with owner info and vehicle plate."
      allOf:
        - $ref: '#/components/schemas/BookingResponse'
        - type: object
          properties:
            ownerId:
              type: integer
              format: int64
              description: "Vehicle owner user ID"
              example: 3
            ownerFullName:
              type: string
              description: "Owner's firstName + lastName"
              example: "Jane Smith"
            vehicleLicensePlate:
              type: string
              description: "Vehicle license plate"
              example: "ABC 1234"

    AdminBookingDetailResponse:
      type: object
      description: "Complete booking details for admin view. Extends AdminBookingResponse with all details including photos and exact coordinates."
      allOf:
        - $ref: '#/components/schemas/AdminBookingResponse'
        - type: object
          properties:
            vehicleMake:
              type: string
              description: "Vehicle make"
              example: "Toyota"
            vehicleModel:
              type: string
              description: "Vehicle model"
              example: "Corolla"
            vehicleYear:
              type: integer
              description: "Vehicle year"
              example: 2022
            vehicleCategory:
              type: string
              enum: [SEDAN, SUV, VAN, TRUCK, COMPACT]
              description: "Vehicle category"
              example: "SEDAN"
            vehicleServiceType:
              type: string
              enum: [TAXI_AND_DELIVERY, DELIVERY_ONLY]
              description: "Vehicle's service type classification"
              example: "TAXI_AND_DELIVERY"
            vehicleHourlyRate:
              type: number
              format: double
              description: "Vehicle's hourly rate"
              example: 15.50
            pickupLocation:
              type: string
              nullable: true
              maxLength: 200
              description: "Human-readable pickup location"
              example: "Downtown Vancouver"
            pickupLatitude:
              type: number
              format: double
              nullable: true
              description: "Exact pickup latitude (always exact for admin)"
              example: 49.2827
            pickupLongitude:
              type: number
              format: double
              nullable: true
              description: "Exact pickup longitude (always exact for admin)"
              example: -123.1207
            pickupPhotoUrls:
              type: array
              items:
                type: string
              nullable: true
              description: "File paths to pickup condition photos"
              example: ["/files/bookings/1/pickup/photo1.jpg", "/files/bookings/1/pickup/photo2.jpg"]
            returnPhotoUrls:
              type: array
              items:
                type: string
              nullable: true
              description: "File paths to return condition photos"
              example: ["/files/bookings/1/return/photo1.jpg"]
            cancellationReason:
              type: string
              nullable: true
              maxLength: 500
              description: "Reason for cancellation or rejection"
              example: null
            cancelledBy:
              type: string
              nullable: true
              enum: [DRIVER, OWNER, SYSTEM]
              description: "Who initiated the cancellation"
              example: null
            confirmedAt:
              type: string
              format: date-time
              nullable: true
              description: "Timestamp of owner confirmation (ISO-8601)"
              example: "2026-03-17T12:00:00.000"
            startedAt:
              type: string
              format: date-time
              nullable: true
              description: "Timestamp of shift start (ISO-8601)"
              example: "2026-03-20T07:50:00.000"
            completedAt:
              type: string
              format: date-time
              nullable: true
              description: "Timestamp of shift completion (ISO-8601)"
              example: "2026-03-20T16:05:00.000"
            cancelledAt:
              type: string
              format: date-time
              nullable: true
              description: "Timestamp of cancellation (ISO-8601)"
              example: null
            effectiveServiceType:
              type: string
              enum: [TAXI_AND_DELIVERY, DELIVERY_ONLY]
              description: "Effective service type based on driver's license class + vehicle classification"
              example: "TAXI_AND_DELIVERY"
            serviceTypeWarning:
              type: string
              nullable: true
              description: "Informational warning about service type restrictions. Null when no mismatch."
              example: null

    # ── Error Schemas ─────────────────────────────────────────────

    ErrorResponse:
      type: object
      description: "Standard business error response. Used for all BOOK-XXX, VEH-XXX, DOC-XXX, and AUTH-XXX errors."
      properties:
        code:
          type: string
          description: "Error code (e.g. BOOK-001, VEH-004)"
          example: "BOOK-011"
        message:
          type: string
          description: "Human-readable error message"
          example: "Booking not found"
        status:
          type: integer
          description: "HTTP status code"
          example: 404
        timestamp:
          type: string
          format: date-time
          description: "Error timestamp (ISO-8601)"
          example: "2026-03-17T10:00:00.000"

    ValidationErrorResponse:
      type: object
      description: "Validation error response. Returned when request fields fail bean validation."
      properties:
        code:
          type: string
          description: "Always VALIDATION-001"
          example: "VALIDATION-001"
        error:
          type: string
          description: "Always 'Validation Failed'"
          example: "Validation Failed"
        status:
          type: integer
          description: "Always 400"
          example: 400
        timestamp:
          type: string
          format: date-time
          example: "2026-03-17T10:00:00.000"
        details:
          type: object
          additionalProperties:
            type: string
          description: "Map of field names to validation error messages"
          example:
            vehicleId: "Vehicle ID is required"
            startTime: "Start time is required"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained via POST /api/auth/login or POST /api/auth/verify-otp (Module 1).
        Token payload includes: userId, email, role (DRIVER, CAR_OWNER, or ADMIN).
        Must be sent in the Authorization header: `Bearer <token>`.
