              reason: "Emergency - vehicle needs repairs"
      responses:
        '200':
          description: Booking cancelled by owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              example:
                bookingId: 1
                driverId: 2
                driverFullName: "John Doe"
                vehicleId: 5
                vehicleSummary: "2022 Toyota Corolla"
                status: "CANCELLED"
                startTime: "2026-03-20T08:00:00"
                endTime: "2026-03-20T16:00:00"
                totalHours: 8
                totalPrice: 124.00
                createdAt: "2026-03-17T10:00:00.000"
        '400':
          description: Booking not in CONFIRMED status or missing reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidStatus:
                  summary: Booking not in cancellable status (BOOK-015)
                  value:
                    code: BOOK-015
                    message: "Only pending or confirmed bookings can be cancelled"
                    status: 400
                    timestamp: "2026-03-17T10:00:00.000"
                missingReason:
                  summary: Missing cancellation reason (BOOK-022)
                  value:
                    code: BOOK-022
                    message: "Cancellation reason is required"
                    status: 400
                    timestamp: "2026-03-17T10:00:00.000"
        '401':
          description: Not authenticated
        '403':
          description: Vehicle does not belong to the authenticated owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BOOK-012
                message: "You do not have permission to access this booking"
                status: 403
                timestamp: "2026-03-17T10:00:00.000"
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BOOK-011
                message: "Booking not found"
                status: 404
                timestamp: "2026-03-17T10:00:00.000"

