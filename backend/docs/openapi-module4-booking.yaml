  /api/owner/bookings/{bookingId}:
    get:
      tags: [OwnerBooking]
      summary: Get booking details (owner view)
      description: |
        Returns full booking details for a booking associated with the authenticated owner's vehicle.
        Includes driver info, photos, cancellation details, and timestamps.
        Requires JWT authentication with CAR_OWNER role.
      operationId: getOwnerBookingDetail
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Booking ID
      responses:
        '200':
          description: Full booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailResponse'
        '401':
          description: Not authenticated
        '403':
          description: Booking's vehicle does not belong to the authenticated owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BOOK-012
                message: "You do not have permission to access this booking"
                status: 403
                timestamp: "2026-03-17T10:00:00.000"
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BOOK-011
                message: "Booking not found"
                status: 404
                timestamp: "2026-03-17T10:00:00.000"

  # ── Owner: Confirm Booking ──────────────────────────────────────

  /api/owner/bookings/{bookingId}/confirm:
    put:
      tags: [OwnerBooking]
      summary: Confirm a pending booking
      description: |
        Confirms a PENDING booking. The vehicle must still be active.
        On confirmation, the vehicle's location is copied to the booking's pickup location fields.
        Other PENDING bookings by the same driver that overlap with the confirmed time range are
        auto-rejected with reason "Auto-rejected: driver already has a confirmed booking for this time slot".
        An email notification is sent to the driver.
        Requires JWT authentication with CAR_OWNER role.
      operationId: confirmBooking
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Booking ID
      responses:
        '200':
          description: Booking confirmed, status changed to CONFIRMED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              example:
                bookingId: 1
                driverId: 2
                driverFullName: "John Doe"
                vehicleId: 5
                vehicleSummary: "2022 Toyota Corolla"
                status: "CONFIRMED"
                startTime: "2026-03-20T08:00:00"
                endTime: "2026-03-20T16:00:00"
                totalHours: 8
                totalPrice: 124.00
                createdAt: "2026-03-17T10:00:00.000"
        '400':
          description: Booking not in PENDING status or vehicle not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notPending:
                  summary: Booking not in PENDING status (BOOK-013)
                  value:
                    code: BOOK-013
                    message: "Only pending bookings can be confirmed"
                    status: 400
                    timestamp: "2026-03-17T10:00:00.000"
                vehicleNotActive:
                  summary: Vehicle deactivated since booking was created (BOOK-003)
                  value:
                    code: BOOK-003
                    message: "Vehicle is not currently available for rent"
                    status: 400
                    timestamp: "2026-03-17T10:00:00.000"
        '401':
          description: Not authenticated
        '403':
          description: Vehicle does not belong to the authenticated owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BOOK-012
                message: "You do not have permission to access this booking"
                status: 403
                timestamp: "2026-03-17T10:00:00.000"
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: BOOK-011
                message: "Booking not found"
                status: 404
                timestamp: "2026-03-17T10:00:00.000"

  # ── Owner: Reject Booking ───────────────────────────────────────

  /api/owner/bookings/{bookingId}/reject:
    put:
      tags: [OwnerBooking]
      summary: Reject a pending booking
      description: |
        Rejects a PENDING booking with a required reason.
        An email notification is sent to the driver with the rejection reason.
        Requires JWT authentication with CAR_OWNER role.
      operationId: rejectBooking
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
